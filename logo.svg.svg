<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Warm Amber-Gold Gradient -->
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAC775" />
      <stop offset="100%" stop-color="#EF9F27" />
    </linearGradient>

    <!-- Subtle Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="#0D0D0F" filter="url(#glow)" />

  <!-- Terminal Window -->
  <rect x="64" y="64" width="384" height="384" rx="48" fill="#151518" stroke="#2C2C32" stroke-width="4" />

  <!-- Browser-Style Title Bar Dots -->
  <circle cx="120" cy="120" r="14" fill="#FAC775" />
  <circle cx="176" cy="120" r="14" fill="#FAC775" opacity="0.7" />
  <circle cx="232" cy="120" r="14" fill="#FAC775" opacity="0.4" />

  <!-- Command Prompt Symbol ">_" -->
  <text x="256" y="296" font-family="'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', monospace" font-weight="900" font-size="280" fill="url(#amberGradient)" text-anchor="middle" dominant-baseline="central">>_</text>
</svg>