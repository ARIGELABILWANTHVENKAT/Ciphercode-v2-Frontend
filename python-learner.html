<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CipherCode — Python Learner Series</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <style>
      :root {
        --bg: #050508;
        --panel: #121218;
        --text: #f3f2ea;
        --muted: #888;
        --lime: #c7f74b;
        --orange: #ff6946;
        --cyan: #00d4ff;
        --border: rgba(255, 255, 255, 0.15);
        --mono: "DM Mono", monospace;
        --sans: "Manrope", sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: var(--bg); color: var(--text); font-family: var(--sans); overflow-x: hidden; }
      a { text-decoration: none; color: var(--text); }

      /* ═══════════════ FLUID MOUSE CANVAS BACKGROUND ═══════════════ */
      .fluid-bg {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        z-index: -1;
        pointer-events: none;
        background: var(--bg);
      }

      /* ═══════════════ GLASSMORPHISM NAVBAR ═══════════════ */
      .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(5, 5, 8, 0.6); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
      .nav-logo { font-size: 20px; font-weight: 800; }
      .brand-mark { background: var(--lime); color: #000; padding: 5px; border-radius: 6px; margin-right: 5px; }
      .nav-links { display: flex; gap: 30px; }
      .nav-links a { font-weight: 600; font-size: 14px; position: relative; }
      .nav-links a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--lime); transition: width 0.3s; }
      .nav-links a:hover::after { width: 100%; }
      .nav-links a.active { color: var(--lime); }
      .nav-links a.active::after { width: 100%; }
      .nav-actions { display: flex; align-items: center; gap: 15px; }
      .nav-login-btn { background: transparent; border: 1px solid var(--text); color: var(--text); padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
      .nav-login-btn:hover { background: var(--orange); border-color: var(--orange); color: #000; }

      /* ═══════════════ HERO ═══════════════ */
      .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 150px 40px 50px; text-align: center; }
      .hero h1 { font-size: 5rem; font-weight: 800; margin-bottom: 20px; letter-spacing: -0.03em; }
      .hero h1 span { color: var(--lime); }
      .hero p { color: var(--muted); font-size: 18px; max-width: 450px; line-height: 1.6; margin-bottom: 40px; }
      .typing-cursor { display: inline-block; width: 3px; height: 1em; background: var(--lime); vertical-align: middle; animation: blink 0.7s infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

      /* ═══════════════ BUTTONS (Elastic) ═══════════════ */
      .download-section { display: flex; gap: 20px; margin-bottom: 50px; }
      .btn {
        position: relative; overflow: hidden;
        padding: 16px 32px; border: none; border-radius: 50px;
        font-weight: 800; font-size: 16px; cursor: pointer;
        transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        background: var(--orange); color: #fff; box-shadow: 4px 4px 0 var(--lime);
      }
      .btn:hover { transform: translateY(-5px) scale(1.05); box-shadow: 6px 6px 0 var(--lime); }
      .btn:active { transform: scale(0.95); }
      .btn.pdf { background: var(--text); color: var(--bg); box-shadow: 4px 4px 0 var(--orange); }

      /* ═══════════════ SMALL PORTAL & FULLSCREEN TRIGGER ═══════════════ */
      .portal-container { position: relative; width: 95%; max-width: 1100px; margin: 0 auto 60px; padding: 5px; border-radius: 20px; background: var(--panel); border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.3); cursor: zoom-in; transition: transform 0.3s; }
      .portal-container:hover { border-color: var(--lime); transform: scale(1.01); box-shadow: 0 20px 60px rgba(199, 247, 75, 0.2); }
      .portal-iframe-wrap { border-radius: 15px; overflow: hidden; background: white; }
      .learner-iframe { width: 100%; height: 80vh; border: none; display: block; pointer-events: none; /* Makes container clickable */ }
      
      /* Hover overlay text */
      .expand-hint {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8);
        color: var(--lime);
        padding: 20px 40px;
        border-radius: 50px;
        font-family: var(--mono);
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 1px;
        border: 2px solid var(--lime);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        z-index: 10;
      }
      .portal-container:hover .expand-hint { opacity: 1; }

      /* ═══════════════ CINEMATIC PORTAL FULLSCREEN MODAL ═══════════════ */
      .fullscreen-modal {
        position: fixed; inset: 0;
        z-index: 10000;
        background: rgba(0, 0, 0, 0.97);
        backdrop-filter: blur(20px);
        display: flex; justify-content: center; align-items: center;
        visibility: hidden; opacity: 0;
        pointer-events: none;
      }
      .fullscreen-modal.fs-open {
        visibility: visible; opacity: 1;
        pointer-events: auto;
      }
      .fs-content {
        position: relative;
        width: 95vw; height: 95vh;
        background: var(--panel);
        border: 2px solid var(--lime);
        border-radius: 20px;
        overflow: hidden;
        transform: scale(0.2) rotate(10deg) blur(20px); /* Portal Enter State */
        opacity: 0;
        transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      }
      .fullscreen-modal.fs-open .fs-content {
        transform: scale(1) rotate(0deg) blur(0); /* Portal Final State */
        opacity: 1;
      }
      .fs-iframe { width: 100%; height: 100%; border: none; }
      
      .fs-close {
        position: absolute; top: 20px; right: 20px; z-index: 10;
        background: var(--orange); border: none; color: #fff;
        width: 50px; height: 50px; border-radius: 50%;
        font-size: 24px; font-weight: 800; cursor: pointer;
        transition: transform 0.3s ease, background 0.3s;
      }
      .fs-close:hover { transform: rotate(90deg) scale(1.1); background: var(--lime); color: #000; }

      /* ═══════════════ FOOTER ═══════════════ */
.footer { padding: 40px; text-align: center; color: var(--muted); background: rgba(0, 0, 0, 0.5); }
.footer strong { color: var(--lime); }
      @media (max-width: 900px) {
        .hero h1 { font-size: 3rem; }
        .download-section { flex-direction: column; align-items: center; }
        .learner-iframe { height: 80vh; }
      }
    </style>
  </head>
  <body>

    <!-- ═══════════════ FLUID MOUSE CANVAS ═══════════════ -->
    <canvas id="fluid-canvas" class="fluid-bg"></canvas>

    <!-- Navbar -->
    <nav class="navbar">
      <a href="index.html" class="nav-logo"><span class="brand-mark">&lt;/&gt;</span> CIPHER<span>CODE</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="tools.html">Tools</a>
        <a href="workspace.html">Workspace</a>
        <a href="python-learner.html" class="active">Python Series</a>
      </div>
      <div class="nav-actions">
        <button class="nav-login-btn" onclick="sessionStorage.removeItem('isLoggedIn');window.location.href='index.html'">Logout ↗</button>
      </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
      <h1>Python <span>Total Series</span></h1>
      <p id="typing-text"></p><span class="typing-cursor"></span>
    </section>

    <!-- Buttons -->
    <div class="download-section">
      <button class="btn" onclick="downloadHTML()">⬇ Download HTML</button>
      <button class="btn pdf" onclick="downloadPDF()">🖨️ Print / Save as PDF</button>
    </div>

    <!-- Mini Portal (Click to Expand) -->
    <div class="portal-container" onclick="openFullscreen()">
      <div class="portal-iframe-wrap">
        <iframe class="learner-iframe" src="python-guide.html" title="Python Complete Beginner Guide"></iframe>
      </div>
      <div class="expand-hint">⛶ CLICK TO EXPAND</div>
    </div>

    <div class="footer">© 2026 <strong>CipherCode</strong></div>

    <!-- ═══════════════ FULLSCREEN PORTAL MODAL ═══════════════ -->
    <div class="fullscreen-modal" id="fs-modal">
      <div class="fs-content">
        <button class="fs-close" onclick="closeFullscreen()">×</button>
        <iframe id="fs-iframe" class="fs-iframe" src="about:blank"></iframe>
      </div>
    </div>

    <script>
      // ═══════════════ MOUSE FLUID BACKGROUND (Canvas) ═══════════════
      const canvas = document.getElementById('fluid-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const colors = ['#c7f74b', '#ff6946', '#00d4ff', '#f3f2ea']; // Lime, Orange, Cyan, White

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      // Create a fluid particle when the mouse moves
      document.addEventListener('mousemove', (e) => {
        if (particles.length > 70) particles.shift(); // Limit particles
        particles.push({
          x: e.clientX,
          y: e.clientY,
          radius: Math.random() * 15 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          growth: Math.random() * 0.8 + 0.2
        });
      });

      function animateFluid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.globalCompositeOperation = 'lighter'; // Makes colors blend beautifully!
        
        particles.forEach(p => {
          p.radius += p.growth;
          p.alpha -= 0.025;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.fill();
        });
        
        // Remove faded particles
        particles = particles.filter(p => p.alpha > 0);
        requestAnimationFrame(animateFluid);
      }
      animateFluid();

      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });

      // ═══════════════ TYPING EFFECT ═══════════════
      const text = "From Absolute Beginner to Pro — A Complete Unit-Wise Guide";
      const typingElement = document.getElementById('typing-text');
      let index = 0;
      function typeLoop() {
        if (index < text.length) {
          typingElement.textContent += text.charAt(index);
          index++;
          setTimeout(typeLoop, 40);
        }
      }
      typeLoop();

      // ═══════════════ FULLSCREEN PORTAL LOGIC ═══════════════
      const fsModal = document.getElementById('fs-modal');
      const fsIframe = document.getElementById('fs-iframe');
      let isOpen = false;

      function openFullscreen() {
        fsIframe.src = 'python-guide.html'; // Load the content in the fullscreen iframe
        fsModal.classList.add('fs-open');
        document.body.style.overflow = 'hidden'; // Disable background scroll
      }

      function closeFullscreen() {
        fsModal.classList.remove('fs-open');
        document.body.style.overflow = 'auto'; // Re-enable background scroll
        setTimeout(() => { fsIframe.src = 'about:blank'; }, 300); // Clear after animation
      }

      // ═══════════════ DOWNLOADS ═══════════════
      async function downloadHTML() {
        try {
          const response = await fetch('python-guide.html');
          const html = await response.text();
          const blob = new Blob([html], { type: 'text/html' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'Python-Complete-Beginner-Guide.html';
          a.click();
          URL.revokeObjectURL(url);
        } catch (error) {
          alert("Error loading the guide. Make sure 'python-guide.html' is in the same folder.");
        }
      }

      async function downloadPDF() {
        try {
          const response = await fetch('python-guide.html');
          const html = await response.text();
          const printWindow = window.open('', '_blank');
          printWindow.document.write(html);
          printWindow.document.close();
          printWindow.onload = function() {
            printWindow.focus();
            printWindow.print();
          };
        } catch (error) {
          alert("Error loading the guide.");
        }
      }
    </script>
  </body>
</html>
